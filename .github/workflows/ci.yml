# ggsvelte CI orchestrator (path routing + gate). Domain job bodies live in
# ci-*.yml reusable workflows (issue #392) so this file stays navigable.
#
# Path routing: scripts/ci-routing.ts classifies the changed file set and
# emits per-job flags. Expensive jobs are skipped when their inputs did not
# change. The `ci-gate` job is the single required aggregator so skipped jobs
# do not look like missing checks.
#
# Content-hash skip (issue #245): domain jobs may early-exit on a success
# marker. bypass_content_cache disables short-circuit under force-all /
# lockfile / ci*.yml / ci-routing / .github/actions changes.
# Invalidate via CONTENT_HASH_SCHEMA, matched inputs, or CI_DISABLE_CONTENT_HASH=1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on every ref — including main. Hosted elastic
  # pool (not self-hosted) keeps the job graph from serializing.
  cancel-in-progress: true

env:
  # Keep in sync with: support-matrix.json browsers.playwright, package pins,
  # and every ci-runner image input below (asserted in support-matrix.test.ts).
  # Bumping this tag is step 2 of a two-step process (issue #610): first
  # prepublish via build-ci-image.yml, then point consumers here.
  PLAYWRIGHT_CONTAINER_TAG: v1.61.1-noble

jobs:
  detect-changes:
    name: detect-changes (path routing)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # pull-requests:read not required — we use event SHAs, not the API.
    outputs:
      checks: ${{ steps.route.outputs.checks }}
      unit: ${{ steps.route.outputs.unit }}
      component: ${{ steps.route.outputs.component }}
      consumer: ${{ steps.route.outputs.consumer }}
      build: ${{ steps.route.outputs.build }}
      svelte_check: ${{ steps.route.outputs.svelte_check }}
      docs_site: ${{ steps.route.outputs.docs_site }}
      actions_security: ${{ steps.route.outputs.actions_security }}
      bench_smoke: ${{ steps.route.outputs.bench_smoke }}
      interaction_perf: ${{ steps.route.outputs.interaction_perf }}
      packages_dist: ${{ steps.route.outputs.packages_dist }}
      vr: ${{ steps.route.outputs.vr }}
      pages: ${{ steps.route.outputs.pages }}
      docs_journeys: ${{ steps.route.outputs.docs_journeys }}
      bypass_content_cache: ${{ steps.route.outputs.bypass_content_cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-setup-bun
      - id: route
        name: classify changed paths → job flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          # PR base SHA is trustworthy; push uses the pre-push tip (may be zeros
          # on a newly created branch — force-all in that case).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # Issue #246: run-compat must force consumer after path routing.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # Path routing + #244 main thinning + #246 run-compat live in
        # scripts/ci-routing/detect-changes.ts (issue #393). Env-only contract
        # keeps untrusted PR text out of the shell script body (zizmor).
        shell: bash
        run: bun scripts/ci-routing.ts detect-changes

  # Early package build shared by component / consumer / interaction-perf
  # (issue #241). Unit and bench-smoke keep the cheaper `bun run check`
  # (spec/core only) and do not wait on this job.

  packages-dist:
    name: packages-dist (build + upload packages/*/dist)
    needs: detect-changes
    if: needs.detect-changes.outputs.packages_dist == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup-bun
      - id: content_hash
        name: compute content-hash (packages_dist)
        env:
          BYPASS: ${{ needs.detect-changes.outputs.bypass_content_cache }}
          DISABLE: ${{ vars.CI_DISABLE_CONTENT_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${BYPASS:-}" = "true" ] || [ "${DISABLE:-}" = "1" ]; then
            {
              echo "bypass=true"
              echo "hit=false"
            } >> "$GITHUB_OUTPUT"
            echo "content-hash bypassed for packages_dist"
            exit 0
          fi
          echo "bypass=false" >> "$GITHUB_OUTPUT"
          bun scripts/ci-routing.ts hash-inputs --execution packages_dist --os "${RUNNER_OS}"
      - id: dist_cache
        name: restore packages-dist content-hash cache
        if: steps.content_hash.outputs.bypass != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Exact key only (no restore-keys) — incomplete or wrong-tree hits are unsafe.
          path: .packages-dist-cache
          key: ${{ steps.content_hash.outputs.cache_key }}
      - id: restore_dist
        name: materialize packages/*/dist from content-hash cache
        if: steps.content_hash.outputs.bypass != 'true' && steps.dist_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for pkg in spec core svelte; do
            src=".packages-dist-cache/packages/${pkg}/dist"
            if [ ! -d "${src}" ]; then
              echo "incomplete content-hash cache (missing ${src}) — will rebuild"
              echo "hit=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          mkdir -p packages/spec packages/core packages/svelte
          rm -rf packages/spec/dist packages/core/dist packages/svelte/dist
          cp -a .packages-dist-cache/packages/spec/dist packages/spec/
          cp -a .packages-dist-cache/packages/core/dist packages/core/
          cp -a .packages-dist-cache/packages/svelte/dist packages/svelte/
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "packages-dist: restored from content-hash cache"
      - uses: ./.github/actions/ci-bun-install
        if: steps.restore_dist.outputs.hit != 'true'
        with:
          cache_key_prefix: bun
      - name: build packages (tsc -b + svelte-package)
        if: steps.restore_dist.outputs.hit != 'true'
        run: bun run build
      - name: verify required package dist outputs
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            packages/spec/dist/index.js \
            packages/core/dist/index.js \
            packages/svelte/dist/index.js; do
            if [ ! -f "${path}" ]; then
              echo "::error::missing required dist output: ${path}"
              exit 1
            fi
          done
          echo "packages-dist: verified spec/core/svelte dist entrypoints"
      - name: stage packages/*/dist under a single upload root
        # Multi-path upload strips the common prefix, so consumers would see
        # spec/dist instead of packages/spec/dist. Stage once and upload that tree.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .packages-dist-upload
          mkdir -p .packages-dist-upload/packages/spec \
            .packages-dist-upload/packages/core \
            .packages-dist-upload/packages/svelte
          cp -a packages/spec/dist .packages-dist-upload/packages/spec/
          cp -a packages/core/dist .packages-dist-upload/packages/core/
          cp -a packages/svelte/dist .packages-dist-upload/packages/svelte/
      - name: stage content-hash cache payload for save
        if: steps.restore_dist.outputs.hit != 'true' && steps.content_hash.outputs.bypass != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .packages-dist-cache
          mkdir -p .packages-dist-cache/packages/spec \
            .packages-dist-cache/packages/core \
            .packages-dist-cache/packages/svelte
          cp -a packages/spec/dist .packages-dist-cache/packages/spec/
          cp -a packages/core/dist .packages-dist-cache/packages/core/
          cp -a packages/svelte/dist .packages-dist-cache/packages/svelte/
      - name: upload packages/*/dist for same-run consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Same-run artifact identity. Cross-run reuse is the content-hash cache above.
          name: packages-dist
          # Single directory root → download path: packages restores packages/*/dist.
          path: .packages-dist-upload/packages
          if-no-files-found: error
          retention-days: 1

  checks:
    name: checks (pre-commit stage)
    needs: detect-changes
    if: needs.detect-changes.outputs.checks == 'true'
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read

  unit:
    name: unit (bun test spec + core)
    needs: detect-changes
    if: needs.detect-changes.outputs.unit == 'true'
    uses: ./.github/workflows/ci-unit.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  consumer-compat:
    name: packed consumer matrix
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.consumer == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-consumer.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
      event_name: ${{ github.event_name }}
      pr_labels: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  component-svelte:
    name: component-svelte (packages/svelte chromium + coverage + ssr)
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.component == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-component-svelte.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
      # Keep in sync with env.PLAYWRIGHT_CONTAINER_TAG above (env context is
      # unavailable on reusable-workflow `with:` inputs — actionlint).
      playwright_container_tag: v1.61.1-noble
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  component-svelte-fx:
    name: component-svelte-fx (packages/svelte firefox + webkit)
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.component == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-component-svelte-fx.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
      # Keep in sync with env.PLAYWRIGHT_CONTAINER_TAG above (env context is
      # unavailable on reusable-workflow `with:` inputs — actionlint).
      playwright_container_tag: v1.61.1-noble

  component-spikes:
    name: component-spikes (spikes/browser vitest)
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.component == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-component-spikes.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
      # Keep in sync with env.PLAYWRIGHT_CONTAINER_TAG above (env context is
      # unavailable on reusable-workflow `with:` inputs — actionlint).
      playwright_container_tag: v1.61.1-noble

  component-journeys:
    name: component-journeys (docs a11y playwright)
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.docs_journeys == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-component-journeys.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}
      # Keep in sync with env.PLAYWRIGHT_CONTAINER_TAG above (env context is
      # unavailable on reusable-workflow `with:` inputs — actionlint).
      playwright_container_tag: v1.61.1-noble

  interaction-perf:
    name: interaction-perf (p50/p95, informational)
    needs: [detect-changes, packages-dist]
    if: >-
      needs.detect-changes.outputs.interaction_perf == 'true' &&
      needs.packages-dist.result == 'success'
    uses: ./.github/workflows/ci-interaction-perf.yml
    permissions:
      contents: read
    with:
      # Keep in sync with env.PLAYWRIGHT_CONTAINER_TAG above (env context is
      # unavailable on reusable-workflow `with:` inputs — actionlint).
      playwright_container_tag: v1.61.1-noble

  build:
    name: build (packages + knip + type-aware + publint)
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    uses: ./.github/workflows/ci-build.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}

  svelte-check:
    name: svelte-check (packages/svelte + apps/docs)
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte_check == 'true'
    uses: ./.github/workflows/ci-svelte-check.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}

  docs-site:
    name: docs-site (adapter-static build + pages links)
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_site == 'true'
    uses: ./.github/workflows/ci-docs-site.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}

  actions-security:
    name: actions-security (actionlint + zizmor)
    needs: detect-changes
    if: needs.detect-changes.outputs.actions_security == 'true'
    uses: ./.github/workflows/ci-actions-security.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}

  bench-smoke:
    name: bench-smoke (mitata, 1k workload)
    needs: detect-changes
    if: needs.detect-changes.outputs.bench_smoke == 'true'
    uses: ./.github/workflows/ci-bench-smoke.yml
    permissions:
      contents: read
    with:
      bypass_content_cache: ${{ needs.detect-changes.outputs.bypass_content_cache }}

  vr-baseline-guard:
    name: vr-baseline-guard (same-PR smoke baselines)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-vr-baseline-guard.yml
    permissions:
      contents: read

  # Single required aggregator. Skipped jobs are OK when routing disabled them;
  # a required job that is skipped/failed/cancelled fails the gate.
  # interaction-perf is intentionally excluded (informational only).
  # compatibility-matrix lives inside ci-consumer.yml; gate watches consumer-compat.
  ci-gate:
    name: ci-gate (required aggregator)
    if: always()
    needs:
      - detect-changes
      - packages-dist
      - checks
      - unit
      - consumer-compat
      - component-svelte
      - component-svelte-fx
      - component-spikes
      - component-journeys
      - build
      - svelte-check
      - docs-site
      - actions-security
      - bench-smoke
      - vr-baseline-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup-bun
      - name: evaluate required jobs
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          CHECKS_REQ: ${{ needs.detect-changes.outputs.checks }}
          UNIT_REQ: ${{ needs.detect-changes.outputs.unit }}
          COMPONENT_REQ: ${{ needs.detect-changes.outputs.component }}
          CONSUMER_REQ: ${{ needs.detect-changes.outputs.consumer }}
          BUILD_REQ: ${{ needs.detect-changes.outputs.build }}
          SVELTE_CHECK_REQ: ${{ needs.detect-changes.outputs.svelte_check }}
          DOCS_SITE_REQ: ${{ needs.detect-changes.outputs.docs_site }}
          ACTIONS_REQ: ${{ needs.detect-changes.outputs.actions_security }}
          BENCH_REQ: ${{ needs.detect-changes.outputs.bench_smoke }}
          PACKAGES_DIST_REQ: ${{ needs.detect-changes.outputs.packages_dist }}
          DOCS_JOURNEYS_REQ: ${{ needs.detect-changes.outputs.docs_journeys }}
          CHECKS_RES: ${{ needs.checks.result }}
          UNIT_RES: ${{ needs.unit.result }}
          COMPONENT_SVELTE_RES: ${{ needs.component-svelte.result }}
          COMPONENT_SVELTE_FX_RES: ${{ needs.component-svelte-fx.result }}
          COMPONENT_SPIKES_RES: ${{ needs.component-spikes.result }}
          DOCS_JOURNEYS_RES: ${{ needs.component-journeys.result }}
          CONSUMER_RES: ${{ needs.consumer-compat.result }}
          BUILD_RES: ${{ needs.build.result }}
          SVELTE_CHECK_RES: ${{ needs.svelte-check.result }}
          DOCS_SITE_RES: ${{ needs.docs-site.result }}
          ACTIONS_RES: ${{ needs.actions-security.result }}
          BENCH_RES: ${{ needs.bench-smoke.result }}
          PACKAGES_DIST_RES: ${{ needs.packages-dist.result }}
          VR_GUARD_RES: ${{ needs.vr-baseline-guard.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DETECT_RESULT}" != "success" ]; then
            echo "::error::detect-changes failed — cannot trust routing"
            exit 1
          fi
          bun scripts/ci-routing.ts ci-gate
